name: Build Versun Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug
      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Versun.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: versun-android-${{ github.run_number }}
          name: Versun Android ${{ github.run_number }}
          make_latest: true
          files: Versun.apk
          fail_on_unmatched_files: true
